services:
  - type: web
    name: social-media-post-creator
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: SHEETS_WEBAPP_URL
        sync: false
      - key: N8N_TEXT_WEBHOOK
        sync: false
      - key: N8N_IMAGE_WEBHOOK
        sync: false
      - key: N8N_PUBLISH_WEBHOOK
        sync: false
